<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TiniCash — Waiter</title>
  <link rel="stylesheet" href="css/waiter.css">
</head>

<body>
  <!-- ZÁMEK -->
  <div id="lock">
    <h1>TiniCash</h1>
    <div id="lock-display"></div>
    <div id="lock-error"></div>
    <div class="pad" id="lock-pad"></div>
  </div>

  <!-- VÝBĚR STOLU -->
  <div id="view-tables" class="screen">
    <div id="open-accounts"></div>
    <div id="tables-empty" hidden>Žádné otevřené účty</div>
    <div id="tables-entry">
      <div id="table-num-display"></div>
      <div class="pad" id="table-pad"></div>
    </div>
  </div>

  <!-- ÚČET -->
  <div id="view-account" class="screen">
    <div id="acct-bar">
      <span class="acct-table" id="acct-table"></span>
      <span class="acct-total" id="acct-total"></span>
      <button id="btn-done">Hotovo</button>
    </div>
    <div id="acct-items"></div>
    <div id="cat-row">
      <button id="btn-half" aria-label="Půlka">½</button>
      <div id="cat-tabs"></div>
    </div>
    <div id="prod-list"></div>

    <!-- plovoucí vyhledávač produktů (dole vlevo) -->
    <div id="search-fab">
      <button id="search-toggle" aria-label="Hledat produkt">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      <input id="search-input" type="text" inputmode="search" autocomplete="off" placeholder="Hledat produkt…">
      <button id="search-clear" aria-label="Smazat">✕</button>
    </div>
  </div>

  <div id="toast" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/waiter.js"></script>
</body>

</html>
